<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0a1a14"/>
  <defs>
    <linearGradient id="mb1" x1="0" y1="0" x2="800" y2="400">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="mb2" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="400" cy="190" r="190" fill="url(#mb1)" opacity="0.5"/>
  <circle cx="400" cy="180" r="150" fill="url(#mb2)"/>

  <!-- Bulles concentriques : la "bulle" de bien-être -->
  <circle cx="400" cy="180" r="98" fill="none" stroke="#34d399" stroke-width="2" opacity="0.45"/>
  <circle cx="400" cy="180" r="72" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.35"/>
  <circle cx="400" cy="180" r="46" fill="none" stroke="#a7f3d0" stroke-width="1" opacity="0.28"/>

  <!-- Silhouette de méditation stylisée -->
  <circle cx="400" cy="140" r="17" fill="#6ee7b7" opacity="0.65"/>
  <path d="M400 162 C378 162 366 180 366 198 L434 198 C434 180 422 162 400 162 Z" fill="#34d399" opacity="0.55"/>
  <path d="M356 198 C346 208 348 220 362 222 L438 222 C452 220 454 208 444 198 Z" fill="#10b981" opacity="0.45"/>

  <!-- Petites bulles flottantes -->
  <circle cx="236" cy="118" r="9" fill="#6ee7b7" opacity="0.4"/>
  <circle cx="200" cy="168" r="5" fill="#a7f3d0" opacity="0.32"/>
  <circle cx="264" cy="72" r="4" fill="#34d399" opacity="0.3"/>
  <circle cx="566" cy="112" r="11" fill="#6ee7b7" opacity="0.38"/>
  <circle cx="606" cy="164" r="6" fill="#a7f3d0" opacity="0.3"/>
  <circle cx="540" cy="66" r="4" fill="#34d399" opacity="0.28"/>

  <!-- Progression du parcours : 7 jours -->
  <line x1="250" y1="308" x2="550" y2="308" stroke="#134e4a" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="308" x2="450" y2="308" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="250" cy="308" r="7" fill="#34d399" opacity="0.9"/>
  <circle cx="300" cy="308" r="7" fill="#34d399" opacity="0.9"/>
  <circle cx="350" cy="308" r="7" fill="#34d399" opacity="0.9"/>
  <circle cx="400" cy="308" r="7" fill="#34d399" opacity="0.9"/>
  <circle cx="450" cy="308" r="7" fill="#34d399" opacity="0.9"/>
  <circle cx="500" cy="308" r="7" fill="none" stroke="#34d399" stroke-width="2" opacity="0.45"/>
  <circle cx="550" cy="308" r="7" fill="none" stroke="#34d399" stroke-width="2" opacity="0.45"/>

  <text x="400" y="356" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="17" font-weight="600" letter-spacing="3" opacity="0.65">MA BULLE BIEN-ÊTRE</text>
</svg>
